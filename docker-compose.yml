version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ledger-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ledgerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger-backend-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=ledgerdb;Username=postgres;Password=postgrespassword
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger-frontend-app
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  postgres_data:
