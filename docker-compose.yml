version: '3.8'

services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ledger-mssql-db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Strong_Password123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -Q 'SELECT 1'"]
      interval: 8s
      timeout: 5s
      retries: 6
      start_period: 15s

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-backend-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql-db,1433;Database=LedgerDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      mssql-db:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger-frontend-app
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  mssql_data:
