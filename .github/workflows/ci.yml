name: Build, Test & CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Backend Build & Unit/Concurrency Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore AccountTransferLedger.sln

    - name: Build Solution
      run: dotnet build AccountTransferLedger.sln --no-restore -c Release

    - name: Run Tests (Unit, Insufficient Funds, Idempotency, Concurrency)
      run: dotnet test AccountTransferLedger.sln --no-build -c Release --verbosity normal

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/account-transfer-ledger-service/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: frontend/account-transfer-ledger-service
      run: npm ci

    - name: Build Next.js Application
      working-directory: frontend/account-transfer-ledger-service
      run: npm run build
